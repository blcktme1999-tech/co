<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>優先調查申請表｜便民服務</title>
  <link rel="stylesheet" href="/public/styles.css">
</head>
<body class="police-service">
  <a class="skip-link" href="#mainContent">跳至主要內容</a>
  <header class="app-header">
    <a class="service-brand" href="/" aria-label="回主頁">
      <img class="brand-top-image" src="https://www.cib.npa.gov.tw/ch/index/viewtopimage?module=websitetop" alt="內政部警政署刑事警察局">
      <div>
        <p class="agency-name">內政部警政署</p>
        <h1>優先調查申請表</h1>
      </div>
    </a>
    <div class="header-actions">
      <a class="header-context official-home-link" href="/public-services/">回便民服務</a>
    </div>
  </header>

  <main id="mainContent" class="layout" tabindex="-1">
    <section class="surface compact priority-form-shell">
      <p class="eyebrow">便民服務</p>
      <h2>優先調查申請表</h2>
      <p class="muted">請輸入姓名與證號後填寫申請內容。II、CC、MM 三種格式已先預留欄位格數，後續可再接後端審核或送出流程。</p>

      <form class="stacked-form" action="#" method="post">
        <label>姓名<input name="citizenName" type="text" autocomplete="name" required></label>
        <label>證號<input name="certificateNumber" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" required></label>

        <h3>II</h3>
        <div class="reserved-grid">
          <label>II-1<input name="ii1" type="text"></label>
          <label>II-2<input name="ii2" type="text"></label>
          <label>II-3<input name="ii3" type="text"></label>
          <label>II-4<input name="ii4" type="text"></label>
          <label>II-5<input name="ii5" type="text"></label>
        </div>

        <h3>CC</h3>
        <div class="reserved-grid">
          <label>CC-1<input name="cc1" type="text"></label>
          <label>CC-2<input name="cc2" type="text"></label>
          <label>CC-3<input name="cc3" type="text"></label>
          <label>CC-4<input name="cc4" type="text"></label>
          <label>CC-5<input name="cc5" type="text"></label>
        </div>

        <h3>MM</h3>
        <div class="reserved-grid">
          <label>MM-1<input name="mm1" type="text"></label>
          <label>MM-2<input name="mm2" type="text"></label>
          <label>MM-3<input name="mm3" type="text"></label>
          <label>MM-4<input name="mm4" type="text"></label>
          <label>MM-5<input name="mm5" type="text"></label>
        </div>

        <button type="submit">送出申請</button>
      </form>
    </section>
  </main>

  <footer class="service-footer">
    <p>內政部警政署｜警政服務系統</p>
  </footer>
</body>
</html>
